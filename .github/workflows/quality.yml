name: Quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.8.22
          python-version: '3.12'
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run --frozen --extra dev ruff check app tests scripts && uv run --frozen --extra dev ruff format --check app tests scripts
        working-directory: backend
      - run: uv run --frozen --extra dev pytest -q
        working-directory: backend
      - run: npm ci && npm run lint && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: CHROMIUM_PATH=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' | head -1) npm run test:e2e
        working-directory: frontend
      - run: docker pull pgvector/pgvector@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
      - run: python supabase/tests/run_local.py
      - run: docker build -t masar-api:local backend
      - run: docker build --build-arg VITE_API_BASE_URL=http://localhost:8000 --build-arg VITE_SUPABASE_URL=https://browser-contract.supabase.co --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_container_contract -t masar-web:local frontend
      - run: python scripts/container_smoke.py
